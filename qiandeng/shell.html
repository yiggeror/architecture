<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151e2a" />
    <link rel="icon" href="data:," />
    <title>千灯渡</title>
    <style>
      :root {
        color-scheme: dark;
        --shell: #f3eadd;
        --copper: #d3ab89;
        --edge: rgba(206, 171, 143, .43);
        --plaque: linear-gradient(125deg, rgba(39, 36, 45, .91), rgba(27, 39, 49, .88));
        --gutter: clamp(15px, 2.8vw, 42px);
        --left: max(var(--gutter), env(safe-area-inset-left));
        --right: max(var(--gutter), env(safe-area-inset-right));
        --bottom: max(clamp(16px, 3.2vh, 32px), env(safe-area-inset-bottom));
      }
      * { box-sizing: border-box; }
      html, body, #court {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #151e2a;
        color: var(--shell);
      }
      body, button {
        font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #court {
        position: relative;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      canvas {
        display: block;
        outline: 0;
        touch-action: none;
        cursor: grab;
      }
      canvas[data-dragging] { cursor: grabbing; }
      canvas:focus-visible { outline: 2px solid var(--copper); outline-offset: -3px; }
      header, footer {
        position: absolute;
        z-index: 2;
        inset-inline: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-inline: var(--left) var(--right);
        pointer-events: none;
      }
      header {
        top: 0;
        padding-top: max(clamp(16px, 3.3vh, 33px), env(safe-area-inset-top));
        padding-bottom: 24px;
        background: linear-gradient(180deg, #16162285, transparent);
      }
      footer {
        bottom: 0;
        align-items: flex-end;
        padding-top: 25px;
        padding-bottom: var(--bottom);
        background: linear-gradient(0deg, #14142082, transparent);
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .seal {
        width: 33px;
        height: 38px;
        flex: none;
        color: #e0b28c;
        filter: drop-shadow(0 1px 3px #151321);
      }
      .brand h1 {
        margin: 0;
        font-family: "Noto Serif CJK SC", "Songti SC", SimSun, serif;
        font-size: clamp(21px, 2vw, 29px);
        font-weight: 600;
        letter-spacing: .16em;
        line-height: 1.3;
        color: #fff1df;
        text-shadow: 0 1px 5px #191620, 0 1px 15px #19162088;
      }
      .phase, #viewpoints {
        display: inline-flex;
        align-items: center;
        width: max-content;
        border: 1px solid var(--edge);
        background: var(--plaque);
        box-shadow: 0 2px 12px #0c101636, inset 0 0 0 1px #f0d8bd0a;
        border-radius: 4px;
        pointer-events: auto;
      }
      .phase { padding: 2px; }
      #viewpoints { padding-inline: 3px; }
      #viewpoints:empty { display: none; }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-width: 48px;
        height: 34px;
        padding: 0 13px;
        border: 0;
        background: transparent;
        color: #e7ded3;
        font-size: 13px;
        line-height: 1;
        letter-spacing: .07em;
        white-space: nowrap;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        z-index: 1;
        outline: 2px solid #ffdcad;
        outline-offset: 2px;
      }
      button svg, .tip svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .phase button { gap: 6px; border-radius: 2px; }
      .phase [aria-pressed="true"] {
        background: #ecd09a;
        color: #29262b;
      }
      #viewpoints button + button::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 1px;
        height: 11px;
        transform: translateY(-50%);
        background: #d3b39234;
      }
      #viewpoints [aria-pressed="true"] { color: #ffe0b8; }
      #viewpoints [aria-pressed="true"]::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 15px;
        height: 1px;
        background: var(--copper);
      }
      @media (hover: hover) {
        #viewpoints button:hover, .phase button[aria-pressed="false"]:hover {
          background: #dcc3aa22;
          color: #fff4e3;
        }
      }
      .hint {
        align-self: center;
        margin: 0;
        color: #f1e9dc;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: .04em;
        text-shadow: 0 1px 4px #0d1420, 0 1px 8px #0d1420;
      }
      .mouse-guide, .touch-guide { display: inline-flex; align-items: center; gap: 13px; }
      .tip { display: inline-flex; align-items: center; gap: 6px; }
      .tip + .tip { border-left: 1px solid #f0d8bb61; padding-left: 13px; }
      .tip svg { color: #e5ccb1; }
      kbd {
        font: 500 10px/1.5 "SFMono-Regular", Consolas, monospace;
        letter-spacing: .07em;
        border: 1px solid #e6d0b48c;
        border-radius: 2px;
        padding: 0 4px;
      }
      .touch-guide, .touch-tools { display: none; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #loading {
        position: absolute;
        z-index: 1;
        inset: 46% 10% auto;
        margin: 0;
        text-align: center;
        font: 15px/1.8 "Noto Serif CJK SC", "Songti SC", SimSun, serif;
        letter-spacing: .1em;
      }
      @media (max-width: 720px) {
        .mouse-guide { flex-wrap: wrap; gap: 7px; }
        .tip + .tip { padding-left: 7px; }
        button { padding-inline: 10px; }
      }
      @media (max-width: 540px) {
        :root { --gutter: 14px; --bottom: max(14px, env(safe-area-inset-bottom)); }
        .brand { gap: 8px; }
        .seal { width: 26px; height: 31px; }
        .brand h1 { font-size: 21px; letter-spacing: .1em; }
        .phase button { gap: 4px; padding-inline: 7px; font-size: 12px; }
        footer { flex-direction: column; align-items: flex-end; gap: 8px; }
        .hint { align-self: flex-end; }
      }
      @media (any-pointer: coarse), (hover: none) {
        button { min-width: 44px; min-height: 44px; }
        .phase button { padding-inline: 9px; }
        #viewpoints button { padding-inline: 10px; }
        .mouse-guide { display: none; }
        .touch-guide { display: inline-flex; gap: 7px; }
        .touch-guide span + span { border-left: 1px solid #f0d8bb61; padding-left: 7px; }
        footer { flex-direction: column; align-items: flex-end; gap: 7px; }
        .hint { align-self: flex-end; font-size: 12px; }
        .touch-tools {
          display: block;
          position: absolute;
          z-index: 3;
          left: var(--left);
          bottom: var(--bottom);
          pointer-events: none;
        }
        #stick {
          position: relative;
          display: grid;
          place-items: center;
          width: clamp(80px, 18vw, 100px);
          aspect-ratio: 1;
          border: 1px solid #d1b295a6;
          border-radius: 50%;
          background: radial-gradient(circle at 48% 40%, #3c354269, #17262caa);
          box-shadow: 0 2px 9px #1014203d, inset 0 0 0 5px #d4b69b0d;
          touch-action: none;
          pointer-events: auto;
        }
        #stick[data-active] { border-color: #f2ccaa; }
        #stick svg {
          position: absolute;
          inset: 6%;
          width: 88%;
          height: 88%;
          fill: none;
          stroke: #efdbc4c4;
          stroke-width: 1.3;
          stroke-linecap: round;
          stroke-linejoin: round;
          pointer-events: none;
        }
        .knob {
          width: 34%;
          aspect-ratio: 1;
          border: 1px solid #efdbc5d9;
          border-radius: 50%;
          background: linear-gradient(145deg, #dbc2a6db, #97888bba);
          box-shadow: inset 0 0 0 3px #3c333523, 0 2px 5px #14141a5c;
          pointer-events: none;
        }
        #viewpoints [aria-pressed="true"]::after { bottom: 7px; }
      }
      @media (max-width: 408px) and (any-pointer: coarse) {
        :root { --gutter: 10px; }
        .phase button { padding-inline: 6px; }
        #viewpoints button { padding-inline: 7px; }
        #court:has(#viewpoints :nth-child(5)) .touch-tools {
          bottom: calc(var(--bottom) + 66px);
        }
      }
      @media (forced-colors: active) {
        button[aria-pressed="true"] { outline: 1px solid Highlight; outline-offset: -3px; }
      }
      #loading { pointer-events:none; z-index:6; }
      @media (max-width: 480px) and (any-pointer:coarse) {
        #viewpoints button {min-width:44px;padding-inline:6px;}
        .touch-tools {bottom:calc(var(--bottom) + 40px);}
        .hint {font-size:10px;}
      }
      .arrival {
        position:absolute;inset:0;z-index:1;pointer-events:none;
        background:#202a38 center center/cover no-repeat;
        opacity:1;transition:opacity .2s ease;
      }
      #court[aria-busy="false"] .arrival{opacity:0;visibility:hidden}
      #court[aria-busy="true"] header,#court[aria-busy="true"] footer,#court[aria-busy="true"] .touch-tools{z-index:2}
      #court[aria-busy="true"] #loading{
        inset:auto auto max(15vh,80px) 50%;transform:translateX(-50%);
        padding:.28em .85em;color:#fff0d4;font-size:12px;
        background:#1c232bd9;border:1px solid #b7946c84;border-radius:3px;white-space:nowrap;
      }
      /* ARRIVAL_PHOTOS */
    </style>
  </head>
  <body>
    <main id="court" aria-busy="true">
      <div class="arrival" aria-hidden="true"></div>
      <p id="loading" role="status">正在点亮千灯渡…</p>
      <header>
        <div class="brand">
          <svg class="seal" viewBox="0 0 32 37" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 2.6 28.2 2l.8 31.6-25.8.7z" stroke-width="1.5"/>
            <g stroke-width="1.35">
              <path d="M8 17c3-.3 5.9-2.5 8-5.4 1.8 2.9 4.3 4.8 8 5.4M11 17v4.5m10-4.5v4.5M7 22h18M13 10h6m-3-3v4"/>
              <path d="M8.5 24.7c3.2-1.9 5.7-1.8 8.7-.5 2.3.9 4.9.9 7.2-.8M11 28.2c2.1-.9 4.4-.7 6.4.1 1.5.6 3.3.6 5.1-.2"/>
            </g>
          </svg>
          <h1>千灯渡</h1>
        </div>
        <div class="phase" role="group" aria-label="时段">
          <button type="button" data-mode="night" aria-pressed="true">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.8 12.3a6.5 6.5 0 0 1-8.1-8.2 6.6 6.6 0 1 0 8.1 8.2Z"/></svg>
            雨夜
          </button>
          <button type="button" data-mode="day" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2.3v2m0 11.4v2M2.3 10h2m11.4 0h2M4.6 4.6 6 6m8 8 1.4 1.4m0-10.8L14 6m-8 8-1.4 1.4"/></svg>
            白昼
          </button>
        </div>
      </header>
      <div class="touch-tools" aria-hidden="true">
        <div id="stick">
          <svg viewBox="0 0 80 80" aria-hidden="true">
            <path d="m36.5 7.3 3.5-3.5 3.5 3.5m-7 65.4 3.5 3.5 3.5-3.5M7.3 36.5l-3.5 3.5 3.5 3.5m65.4-7 3.5 3.5-3.5 3.5"/>
          </svg>
          <span class="knob"></span>
        </div>
      </div>
      <footer>
        <p class="hint" id="travel-hint">
          <span class="mouse-guide">
            <span class="tip"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.4" y="1.8" width="9.2" height="16.4" rx="4.6"/><path d="M10 5v3"/></svg>拖动环顾</span>
            <span class="tip">滚轮进退</span>
            <span class="tip"><kbd>WASD</kbd>移动</span>
          </span>
          <span class="touch-guide"><span>右手滑动转向</span><span>推杆沿视线进退</span></span>
          <span class="sr-only">前进或后退会跟随视线升降。左右横移，松开移动控件即可悬停。使用键盘时，W 前进，S 后退，A、D 横移，方向键转向，E 上升，Q 下降，Shift 加速。</span>
        </p>
        <nav id="viewpoints" aria-label="景点视角"></nav>
      </footer>
    </main>
    <script>
      /* COURTYARD */
    </script>
  </body>
</html>
