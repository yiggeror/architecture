    <style>

  <body>
    <div class="page">
      <header class="mast">
        <div class="brand"><span class="mark" aria-hidden="true">渡</span><span class="town-title">千灯渡</span><h1>人物图录</h1></div>
        <a class="city-link" id="city-link" href="index.html#person=47">到城中寻访<span aria-hidden="true">↗</span></a>
      </header>
      <main class="sheet">
        <section class="mount" id="mount" aria-label="人物模型">
          <canvas id="figure" tabindex="0" aria-label="人物三维肖像。方向键环看，加减号缩放，空格暂停或播放。"></canvas>
          <div class="stage-controls"><p class="hint"><span class="mouse-hint">拖动环看 · 滚轮缩放</span><span class="touch-hint">单指环看 · 双指缩放</span></p>
            <div class="tools" aria-label="镜头"><button type="button" data-zoom="out" aria-label="缩小">−</button><button type="button" data-zoom="in" aria-label="放大">＋</button><button id="reset-view" type="button">复位</button></div>
          </div>
          <div id="loading" class="loading" role="status">正在展开人物图录…</div>
        </section>
        <aside class="leaf" aria-label="人物与观察设置">
          <div class="directory-line"><button type="button" class="directory-trigger" id="catalog-open" aria-haspopup="dialog"><span class="catalog-icon" aria-hidden="true"></span>人物目录</button>
            <div class="turn"><button id="previous" type="button" aria-label="上一位人物">‹</button><span class="position" id="position"></span><button id="next" type="button" aria-label="下一位人物">›</button></div>
          </div>
          <div class="person" aria-live="polite"><h2 id="person-name"></h2><p id="person-role"></p></div>
          <div class="paint"><div class="datum"><span class="key">衣装</span><span id="clothing"></span></div><div class="datum"><span class="key">衣色</span><span class="pigments" id="pigments" aria-label="衣装配色"></span></div></div>
          <details class="trials" id="trials"><summary>造型试样<small id="trial-status">原样</small></summary>
            <div class="trial-form">
              <label class="jaw-label" for="trial-jaw">脸廓<input id="trial-jaw" type="range" min="-1" max="1" step=".01"><output for="trial-jaw" id="jaw-value"></output></label>
              <label>发式<select id="trial-hair"></select></label><label>衣式<select id="trial-garment"></select></label>
              <label>织纹<select id="trial-pattern"></select></label><button type="button" id="trial-reset" disabled>复原造型</button>
              <div class="trial-export"><button type="button" id="export-figure"><span aria-hidden="true">↓</span>导出 GLB</button><small id="export-status" role="status"></small></div>
            </div>
          </details>
          <div class="settings">
            <fieldset><legend>取景</legend><div class="segmented"><button type="button" data-view-choice="portrait" aria-pressed="true">肖像</button><button type="button" data-view-choice="full" aria-pressed="false">全身</button><button type="button" data-view-choice="hand" aria-pressed="false">手部</button></div>
              <div class="hand-choice" id="hand-choice" aria-label="观察哪只手" hidden><button type="button" data-hand="r" aria-pressed="true">右手</button><button type="button" data-hand="l" aria-pressed="false">左手</button></div></fieldset>
            <fieldset><legend>照明</legend><div class="segmented"><button type="button" data-light-choice="day" aria-pressed="true"><i class="light-dot" aria-hidden="true"></i>天光</button><button type="button" data-light-choice="night" aria-pressed="false"><i class="light-dot" aria-hidden="true"></i>灯下</button></div></fieldset>
          </div>
          <div class="transport"><div class="transport-line"><label for="scrub" class="play-label">动作进度</label><button type="button" id="playback" class="toggle-play"><span class="play-icon" aria-hidden="true"></span><span id="play-text">暂停</span></button></div>
            <div class="track-row"><input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="拖动查看动作进度" /><output for="scrub" id="timecode"></output></div>
          </div>
        </aside>
      </main>
    </div>
    <dialog id="catalog" aria-labelledby="catalog-title"><div class="catalog-head"><h2 id="catalog-title">人物目录</h2><button type="button" id="catalog-close" class="close" aria-label="关闭人物目录">×</button></div>
      <div class="catalog-filter"><label for="role-filter">行当</label><select id="role-filter"><option value="all">全部行当</option></select></div><ul id="cast-list"></ul>
    </dialog>

    </script>
  </body>
</html>
